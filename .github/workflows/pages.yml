name: Publish PsychTerms
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/check_schemas.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_packets.py
      - run: python3 scripts/risk_registry.py
      - run: python3 scripts/export_allowlist.py
      - run: npm ci --ignore-scripts
      - run: npm run test:site
      - run: npm run build
        env:
          SITE_URL: https://cloudronin.github.io
          BASE_PATH: /psychterms/
      - run: python3 scripts/check_site.py --base /psychterms/
      - run: python3 scripts/check_copy.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
# No paid credentials or model calls. Site content remains labelled development preview.
